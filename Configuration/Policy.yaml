privilegeTargets:
  # Each one is an OAuth scope as well: the matcher is its name (a constant of Neos\Api\Security\ApiScopes), the label
  # its description on the consent page. A token needs the scope, its account the privilege
  'Neos\Api\Security\ApiPrivilege':
    "Neos.Api:Me.Read":
      label: "Read your account"
      matcher: "me.read"
    "Neos.Api:Me.Update":
      label: "Change your name, email address, interface language and preferences"
      matcher: "me.update"
    "Neos.Api:Me.Password":
      label: "Change your password"
      matcher: "me.password"
    "Neos.Api:Users.Read":
      label: "List and read the Neos users"
      matcher: "users.read"
    "Neos.Api:Users.Update":
      label: "Change the Neos users"
      matcher: "users.update"
    "Neos.Api:Users.Create":
      label: "Create Neos users"
      matcher: "users.create"
    "Neos.Api:Users.Delete":
      label: "Delete Neos users"
      matcher: "users.delete"
    "Neos.Api:Sites.Read":
      label: "List and read the Neos sites"
      matcher: "sites.read"
    "Neos.Api:Sites.Update":
      label: "Change the Neos sites and their domains"
      matcher: "sites.update"
    "Neos.Api:Sites.Create":
      label: "Create Neos sites"
      matcher: "sites.create"
    "Neos.Api:Sites.Delete":
      label: "Delete Neos sites with their content"
      matcher: "sites.delete"
    "Neos.Api:ContentRepositories.Read":
      label: "List and read the content repositories and their dimensions"
      matcher: "contentrepositories.read"
    "Neos.Api:NodeTypes.Read":
      label: "List and read the node types and their configuration"
      matcher: "nodetypes.read"
    "Neos.Api:Views.Read":
      label: "Render views of the nodes you can read"
      matcher: "views.read"
    "Neos.Api:Nodes.Read":
      label: "Read the nodes you can read"
      matcher: "nodes.read"
    "Neos.Api:Nodes.Update":
      label: "Change the properties of the nodes you can edit"
      matcher: "nodes.update"
    "Neos.Api:Nodes.Create":
      label: "Create nodes where you can edit"
      matcher: "nodes.create"
    "Neos.Api:Nodes.Delete":
      label: "Delete the nodes you can edit and restore them"
      matcher: "nodes.delete"
    "Neos.Api:Workspaces.Read":
      label: "List the workspaces you can read and the changes in them"
      matcher: "workspaces.read"
    "Neos.Api:Workspaces.Update":
      label: "Change the workspaces you manage, their title, description and base workspace"
      matcher: "workspaces.update"
    "Neos.Api:Workspaces.Create":
      label: "Create workspaces, your personal one and shared ones"
      matcher: "workspaces.create"
    "Neos.Api:Workspaces.Delete":
      label: "Delete the workspaces you manage"
      matcher: "workspaces.delete"
    "Neos.Api:Workspaces.Publish":
      label: "Publish, discard and rebase the changes in the workspaces you can write to"
      matcher: "workspaces.publish"
    "Neos.Api:Workspaces.Roles":
      label: "Assign and remove the roles in the workspaces you manage"
      matcher: "workspaces.roles"
    "Neos.Api:DataSources.Read":
      label: "Get the data of the data sources, e.g. the options of select boxes"
      matcher: "datasources.read"
    "Neos.Api:Assets.Read":
      label: "List and read the assets of the media library and remote asset sources, and where they are used"
      matcher: "assets.read"
    "Neos.Api:Assets.Update":
      label: "Change the assets of the media library, their metadata, tags, collections and files"
      matcher: "assets.update"
    "Neos.Api:Assets.Create":
      label: "Upload and import assets into the media library and create image variants"
      matcher: "assets.create"
    "Neos.Api:Assets.Delete":
      label: "Delete assets of the media library that aren't in use"
      matcher: "assets.delete"
    "Neos.Api:AssetTags.Read":
      label: "List and read the tags of the media library"
      matcher: "assettags.read"
    "Neos.Api:AssetTags.Update":
      label: "Rename and move the tags of the media library"
      matcher: "assettags.update"
    "Neos.Api:AssetTags.Create":
      label: "Create tags in the media library"
      matcher: "assettags.create"
    "Neos.Api:AssetTags.Delete":
      label: "Delete tags of the media library"
      matcher: "assettags.delete"
    "Neos.Api:AssetCollections.Read":
      label: "List and read the collections of the media library"
      matcher: "assetcollections.read"
    "Neos.Api:AssetCollections.Update":
      label: "Rename the collections of the media library"
      matcher: "assetcollections.update"
    "Neos.Api:AssetCollections.Create":
      label: "Create collections in the media library"
      matcher: "assetcollections.create"
    "Neos.Api:AssetCollections.Delete":
      label: "Delete collections of the media library"
      matcher: "assetcollections.delete"
    "Neos.Api:Caches.Read":
      label: "List the caches of Flow and Neos"
      matcher: "caches.read"
    "Neos.Api:Caches.Flush":
      label: "Flush the caches of Flow and Neos"
      matcher: "caches.flush"

roles:
  "Neos.Flow:AuthenticatedUser":
    privileges:
      - privilegeTarget: "Neos.Api:Me.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Me.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Me.Password"
        permission: GRANT
      # which nodes a view shows is up to the account's node privileges
      - privilegeTarget: "Neos.Api:Views.Read"
        permission: GRANT
      # which nodes are found is up to the account's node privileges
      - privilegeTarget: "Neos.Api:Nodes.Read"
        permission: GRANT
      # which workspaces and events are listed is up to the account's workspace roles (and for events its node privileges)
      - privilegeTarget: "Neos.Api:Workspaces.Read"
        permission: GRANT

  "Neos.Neos:AbstractEditor":
    privileges:
      # the entry point to the nodes, writing them stays with administrators
      - privilegeTarget: "Neos.Api:Sites.Read"
        permission: GRANT
      # which nodes may be changed in which workspaces is up to the account's workspace roles and node privileges
      - privilegeTarget: "Neos.Api:Nodes.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Nodes.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Nodes.Delete"
        permission: GRANT
      # as Neos grants Neos.Neos:Backend.DataSource
      - privilegeTarget: "Neos.Api:DataSources.Read"
        permission: GRANT
      # as Neos grants Neos.Workspace.Ui:Backend.CreateWorkspaces, which workspaces may be changed or deleted is up to
      # the account's workspace roles (manage)
      - privilegeTarget: "Neos.Api:Workspaces.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Workspaces.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Workspaces.Delete"
        permission: GRANT
      # which workspaces may be published, discarded or rebased is up to the account's workspace roles (write)
      - privilegeTarget: "Neos.Api:Workspaces.Publish"
        permission: GRANT
      # who may assign roles is up to the account's workspace roles (manage)
      - privilegeTarget: "Neos.Api:Workspaces.Roles"
        permission: GRANT
      # as Neos grants managing assets, tags and collections (Neos.Media.Browser:ManageAssets, :ManageTags,
      # :ManageAssetCollections), which ones the account sees is up to Neos' media privileges
      - privilegeTarget: "Neos.Api:Assets.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Assets.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Assets.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Assets.Delete"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetTags.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetTags.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetTags.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetTags.Delete"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetCollections.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetCollections.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetCollections.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:AssetCollections.Delete"
        permission: GRANT

  "Neos.Neos:Editor":
    privileges:
      - privilegeTarget: "Neos.Api:ContentRepositories.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:NodeTypes.Read"
        permission: GRANT

  # as Neos grants the users module: a user manager only manages users whose roles are a subset of their own, see
  # AccountPrivileges::mayManage()
  "Neos.Neos:UserManager":
    privileges:
      - privilegeTarget: "Neos.Api:Users.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Delete"
        permission: GRANT

  "Neos.Neos:Administrator":
    privileges:
      - privilegeTarget: "Neos.Api:Users.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Users.Delete"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Sites.Update"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Sites.Create"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Sites.Delete"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Caches.Read"
        permission: GRANT
      - privilegeTarget: "Neos.Api:Caches.Flush"
        permission: GRANT
