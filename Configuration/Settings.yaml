Neos:
  Api:
    docs:
      # The OAuth client the docs log in with, declared in Neos.OAuth.clients below
      clientId: 'neos-api-docs'
      swaggerUiVersion: '5.33.0'

  OpenApi:
    FlowAdapter:
      apis:
        neos:
          uriPrefix: 'api'
          info:
            title: 'Neos API'
            version: '1.0.0'
          classes:
            'Neos\Api\Endpoints\Me': true
            'Neos\Api\Endpoints\Users': true
          specPath: 'openapi.json'
          # the docs are served by Neos.Api's DocsController, which lets users log in
          authContextProvider: 'Neos\Api\Security\ApiAuthContextProvider'

  OAuth:
    # one entry per constant of Neos\Api\Security\ApiScopes
    scopes:
      'neos.read': 'Read your account and the content of Neos'
      'neos.write': 'Change the content and the users of Neos'
    protectedResources:
      # the key is Neos\Api\Http\OAuthChallengeMiddleware::RESOURCE
      'Neos.Api':
        path: 'api'
        name: 'Neos API'
        scopes: ['neos.read', 'neos.write']
        documentation: 'api/docs'
    clients:
      # Swagger UI on /api/docs: users log in with their Neos account (authorization code flow with PKCE)
      'neos-api-docs':
        name: 'Neos API docs'
        redirectUris: ['{issuer}/api/docs/oauth2-redirect']
        grantTypes: ['authorization_code']
        firstParty: true

  Flow:
    mvc:
      routes:
        'Neos.Api':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          'Neos.OAuth:Bearer':
            requestPatterns:
              'Neos.Api:Api':
                pattern: 'Uri'
                patternOptions:
                  uriPattern: '/api/.*'

    http:
      middlewares:
        'Neos.Api:oauthChallenge':
          position: 'before dispatch'
          middleware: 'Neos\Api\Http\OAuthChallengeMiddleware'
