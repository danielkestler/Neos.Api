Neos:
  Api:
    # The views GET /views/{viewName}?nodeAggregateId={nodeAggregateId} renders, only these are exposed. The prototype inherits from
    # Neos.Api:View and is looked up in the Fusion of the node's site, e.g.
    #   mainNavigation:
    #     prototype: 'Vendor.Site:Api.MainNavigation'
    #     description: 'The main navigation with grouping folders'
    #     # optional: handle Fusion errors as in the frontend (e.g. a content element shows its error in its place)
    #     # instead of failing the view with a 500
    #     renderErrors: false
    # A view is removed by setting it to ~
    views:
      documentNodesTree:
        prototype: "Neos.Api:View.DocumentNodesTree"
        description: "The document node of the node with its child document nodes, as items of a tree that loads level by level"
      contentNodesTree:
        prototype: "Neos.Api:View.ContentNodesTree"
        description: "The node with its child content nodes and content collections, as items of a tree that loads level by level"
      document:
        prototype: "Neos.Api:View.Document"
        description: "The document node of the node with its properties, references and its whole content: all child content nodes and content collections with theirs, nested"
      fusionPathHtml:
        prototype: "Neos.Api:View.FusionPathHtml"
        description: "The HTML of the content element as the page renders it, rendered at its Fusion path arguments[fusionPath] (its data-__neos-fusion-path attribute with renderingMode=inPlace), e.g. to replace it in a preview after a change. Only in a rendering mode other than frontend, for paths below root or the mode's fusionRenderingPath"
        # an element that fails to render shows its error in its place, as in the Neos backend
        renderErrors: true

    # Implementations of Neos\Api\Extension\NodeReadFilter that narrow down the nodes of listNodes (searches, trees),
    # applied in this order to each page after it is read. A filter is removed by setting it to ~, e.g.
    #   'Vendor.Package:hiddenItems': 'Vendor\Package\Api\HiddenItemsFilter'
    nodeReadFilters: {}

  OpenApi:
    FlowAdapter:
      apis:
        neos:
          uriPrefix: "api"
          info:
            title: "Neos API"
            version: "1.0.0"
          classes:
            'Neos\Api\Endpoint\Me\Me': true
            'Neos\Api\Endpoint\Users\Users': true
            'Neos\Api\Endpoint\People\People': true
            'Neos\Api\Endpoint\Sites\Sites': true
            'Neos\Api\Endpoint\ContentRepositories\ContentRepositories': true
            'Neos\Api\Endpoint\Nodes\Nodes': true
            'Neos\Api\Endpoint\NodeTypes\NodeTypes': true
            'Neos\Api\Endpoint\Workspaces\Workspaces': true
            'Neos\Api\Endpoint\Views\Views': true
            'Neos\Api\Endpoint\DataSources\DataSources': true
            'Neos\Api\Endpoint\Assets\Assets': true
            'Neos\Api\Endpoint\AssetTags\AssetTags': true
            'Neos\Api\Endpoint\AssetCollections\AssetCollections': true
            'Neos\Api\Endpoint\Options\Options': true
            'Neos\Api\Endpoint\Caches\Caches': true
          specPath: "openapi.json"
          # the docs are served by Neos.Api.Docs, which lets users log in
          authContextProvider: 'Neos\Api\Security\ApiAuthContextProvider'

  Neos:
    fusion:
      autoInclude:
        # Neos.Api:View and the views above
        "Neos.Api": true

  Fusion:
    defaultContext:
      "Neos.Api.Node": 'Neos\Api\Infrastructure\Eel\NodeHelper'

  OAuth:
    # the scopes are the ApiPrivilege targets of Policy.yaml
    scopeProviders:
      "Neos.Api": 'Neos\Api\Security\PrivilegeScopes'
    # the consent page's groups, the icons are Font Awesome Free (CC BY 4.0)
    scopeGroups:
      "me":
        label: 'Your profile'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/user.svg'
        position: 10
      "users":
        label: 'Users'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/users.svg'
        position: 20
      "people":
        label: 'People'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/address-book.svg'
        position: 25
      "sites":
        label: 'Sites'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/globe.svg'
        position: 30
      "contentrepositories":
        label: 'Content repositories'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/database.svg'
        position: 40
      "nodetypes":
        label: 'Node types'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/cubes.svg'
        position: 50
      "nodes":
        label: 'Content'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/file-lines.svg'
        position: 60
      "workspaces":
        label: 'Workspaces'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/layer-group.svg'
        position: 70
      "views":
        label: 'Rendering'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/eye.svg'
        position: 80
      "datasources":
        label: 'Data sources'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/plug.svg'
        position: 90
      "assets":
        label: 'Media'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/image.svg'
        position: 100
      "assettags":
        label: 'Media tags'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/tags.svg'
        position: 110
      "assetcollections":
        label: 'Media collections'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/folder-open.svg'
        position: 120
      "caches":
        label: 'Caches'
        icon: 'resource://Neos.Api/Public/Icons/Scopes/bolt.svg'
        position: 130
    protectedResources:
      # the key is Neos\Api\Infrastructure\Http\OAuthChallengeMiddleware::RESOURCE
      "Neos.Api":
        path: "api"
        name: "Neos API"
        scopeProvider: 'Neos\Api\Security\PrivilegeScopes'

  Flow:
    security:
      authentication:
        providers:
          "Neos.OAuth:Bearer":
            requestPatterns:
              "Neos.Api:Api":
                pattern: "Uri"
                patternOptions:
                  uriPattern: "/api/.*"

    http:
      middlewares:
        # before Flow's parseBody, which would read php://input as a query string
        "Neos.Api:multipartBody":
          position: "before parseBody"
          middleware: 'Neos\Api\Infrastructure\Http\MultipartBodyMiddleware'
        "Neos.Api:oauthChallenge":
          position: "before dispatch"
          middleware: 'Neos\Api\Infrastructure\Http\OAuthChallengeMiddleware'
        # around oauthChallenge, so its 401 and 403 get the headers as well
        "Neos.Api:cacheHeaders":
          position: "before Neos.Api:oauthChallenge"
          middleware: 'Neos\Api\Infrastructure\Http\ApiCacheHeadersMiddleware'
