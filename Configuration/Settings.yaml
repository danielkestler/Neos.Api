Neos:
  Api:
    docs:
      # The OAuth client the docs log in with, declared in Neos.OAuth.clients below
      clientId: "neos-api-docs"
      swaggerUiVersion: "5.33.0"

    # The views GET /views/{viewName}?nodeAddress={nodeAddress} renders, only these are exposed. The prototype inherits from
    # Neos.Api:View and is looked up in the Fusion of the node's site, e.g.
    #   mainNavigation:
    #     prototype: 'Vendor.Site:Api.MainNavigation'
    #     description: 'The main navigation with grouping folders'
    views: {}

  OpenApi:
    FlowAdapter:
      apis:
        neos:
          uriPrefix: "api"
          info:
            title: "Neos API"
            version: "1.0.0"
          classes:
            'Neos\Api\Endpoint\Me\Me': true
            'Neos\Api\Endpoint\Users\Users': true
            'Neos\Api\Endpoint\ContentRepositories\ContentRepositories': true
            'Neos\Api\Endpoint\Sites\Sites': true
            'Neos\Api\Endpoint\Views\Views': true
          specPath: "openapi.json"
          # the docs are served by Neos.Api's DocsController, which lets users log in
          authContextProvider: 'Neos\Api\Security\ApiAuthContextProvider'

  Neos:
    fusion:
      autoInclude:
        # Neos.Api:View
        "Neos.Api": true

  OAuth:
    # the scopes are the ApiPrivilege targets of Policy.yaml
    scopeProviders:
      "Neos.Api": 'Neos\Api\Security\PrivilegeScopes'
    protectedResources:
      # the key is Neos\Api\Infrastructure\Http\OAuthChallengeMiddleware::RESOURCE
      "Neos.Api":
        path: "api"
        name: "Neos API"
        scopeProvider: 'Neos\Api\Security\PrivilegeScopes'
        documentation: "api/docs"
    clients:
      # Swagger UI on /api/docs: users log in with their Neos account (authorization code flow with PKCE)
      "neos-api-docs":
        name: "Neos API docs"
        redirectUris: ["{issuer}/api/docs/oauth2-redirect"]
        grantTypes: ["authorization_code"]
        firstParty: true

  Flow:
    mvc:
      routes:
        "Neos.Api":
          position: "before Neos.Neos"

    security:
      authentication:
        providers:
          "Neos.OAuth:Bearer":
            requestPatterns:
              "Neos.Api:Api":
                pattern: "Uri"
                patternOptions:
                  uriPattern: "/api/.*"

    http:
      middlewares:
        "Neos.Api:oauthChallenge":
          position: "before dispatch"
          middleware: 'Neos\Api\Infrastructure\Http\OAuthChallengeMiddleware'
        # around oauthChallenge, so its 401 and 403 get the headers as well
        'Neos.Api:cacheHeaders':
          position: 'before Neos.Api:oauthChallenge'
          middleware: 'Neos\Api\Infrastructure\Http\ApiCacheHeadersMiddleware'
